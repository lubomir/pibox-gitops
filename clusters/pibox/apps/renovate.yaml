---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://github.com/lubomir/pibox-gitops.git
      targetRevision: main
      path: clusters/pibox/apps/renovate

    - repoURL: ghcr.io/renovatebot/charts
      chart: renovate
      targetRevision: 46.254.2
      helm:
        values: |
          cronjob:
            schedule: '0 */4 * * *'
          renovate:
            config: |
              {
                "platform": "forgejo",
                "endpoint": "https://git.paas.lsedlar.cz/api/v1",
                "autodiscover": true
              }
          env:
            RENOVATE_GIT_AUTHOR: 'Renovate Bot <noreply@lsedlar.cz>'
            RENOVATE_ALLOWED_COMMANDS: '^\./bump-version\.sh$'
            RENOVATE_DETECT_HOST_RULES_FROM_ENV: 'true'
            RENOVATE_DOCKER_DOCKER_IO_USERNAME: 'lsedlar'
          envFrom:
            - secretRef:
                name: renovate-secret

  destination:
    server: https://kubernetes.default.svc
    namespace: renovate

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
