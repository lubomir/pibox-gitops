---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: weather-downsample
  namespace: weather-station
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            fsGroup: 1000
          containers:
          - name: downsample
            image: docker.io/lsedlar/weather-station-receiver:1.3.2@sha256:86a4fce6050a763e8c17e50e63ec673110548ba4bcc7d67b6c55cee95fd2e128
            imagePullPolicy: IfNotPresent
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            command:
            - /app/.venv/bin/receiver-downsampler
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: databaseUrl
                  name: weather-station-postgres-weather-station-db-user
          restartPolicy: Never
