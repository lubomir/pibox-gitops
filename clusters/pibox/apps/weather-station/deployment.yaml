---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiver
  namespace: weather-station
spec:
  replicas: 1
  selector:
    matchLabels:
      app: receiver
  template:
    metadata:
      labels:
        app: receiver
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: wait-for-postgres
        image: docker.io/library/postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        command:
        - sh
        - -c
        - until psql "$DATABASE_URL" -c 'SELECT 1' > /dev/null 2>&1; do echo waiting for database; sleep 2; done;
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: databaseUrl
              name: weather-station-postgres-weather-station-db-user
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 70
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 64Mi
      containers:
      - env:
        - name: TARGET_DIR
          value: /storage
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: databaseUrl
              name: weather-station-postgres-weather-station-db-user
        - name: TUYA_ACCESS_ID
          valueFrom:
            secretKeyRef:
              key: tuyaAccessId
              name: weather-station-secret
        - name: TUYA_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              key: tuyaAccessSecret
              name: weather-station-secret
        - name: TUYA_DEVICE_ID
          valueFrom:
            secretKeyRef:
              key: tuyaDeviceId
              name: weather-station-secret
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: authToken
              name: weather-station-secret
        - name: LOCAL_KEY
          valueFrom:
            secretKeyRef:
              key: localKey
              name: weather-station-secret
        - name: TUYA_DEVICE_IP
          valueFrom:
            secretKeyRef:
              key: deviceIP
              name: weather-station-secret
        image: docker.io/lsedlar/weather-station-receiver:1.1.7@sha256:05025a44ece1f6e52e439631c0efc48b613a413d0ee32d713f1ff7b6a8480d12
        imagePullPolicy: IfNotPresent
        name: receiver
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
        ports:
        - containerPort: 8000
          protocol: TCP
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /status-check?type=live
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /status-check?type=ready
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /storage
          name: storage
      terminationGracePeriodSeconds: 30
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: weather-station-data
