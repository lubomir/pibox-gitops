---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-dind-cleanup
  namespace: forgejo
  labels:
    app: forgejo-runner
data:
  docker-image-lru.sh: |
    #!/bin/sh
    set -eu
    set -x

    STATE_DIR="${STATE_DIR:-/var/lib/docker/.lru-state}"
    MAX_AGE_DAYS="${MAX_AGE_DAYS:-7}"

    since="${1:?Usage: $0 <since>}"

    if [ ! -d "$STATE_DIR" ]; then
        mkdir -p "$STATE_DIR"

        echo "Initializing image usage metadata"

        docker image ls -q |
        sort -u |
        while IFS= read -r image_id; do
            [ -n "$image_id" ] || continue
            touch "$STATE_DIR/$image_id"
        done
    fi

    docker events \
        --since "$since" \
        --until "$(date -Iseconds)" \
        --filter type=container \
        --filter event=start \
        --format '{{.Actor.Attributes.image}}' |
    while IFS= read -r image; do
        [ -n "$image" ] || continue

        image_id="$(docker image inspect --format '{{.Id}}' "$image" 2>/dev/null || true)"

        [ -n "$image_id" ] || continue

        touch "$STATE_DIR/$image_id"
    done

    find "$STATE_DIR" \
        -type f \
        -mtime "+$MAX_AGE_DAYS" \
        -print |
    while IFS= read -r state_file; do
        image_id="${state_file##*/}"

        if ! docker image inspect "$image_id" >/dev/null 2>&1; then
            echo "Removing stale metadata: $image_id"
            rm -f "$state_file"
            continue
        fi

        echo "Removing unused image: $image_id"

        if docker image rm "$image_id"; then
            rm -f "$state_file"
        else
            echo "Could not remove $image_id; retaining metadata"
        fi
    done
