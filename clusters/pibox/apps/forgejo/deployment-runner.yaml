---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels:
    app: forgejo-runner
spec:
  jobTargetRef:
    activeDeadlineSeconds: 3600
    backoffLimit: 0
    template:
      metadata:
        labels:
          app: forgejo-runner
      spec:
        restartPolicy: Never
        shareProcessNamespace: true
        containers:
          - name: runner
            image: code.forgejo.org/forgejo/runner:13.1.0@sha256:c4af85fd9f0dd03788676a534781a87c71aa2c6a37737143e017eb94d4312952
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 512Mi
            command:
              - sh
              - -c
              - |
                while [ ! -e /certs/ready ]; do
                    echo 'waiting for docker daemon...'
                    sleep 6
                done
                cp /secret/RUNNER_CONFIG /data/.runner
                exec forgejo-runner -c /config/config.yaml one-job
            env:
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_CERT_PATH
                value: /certs/client
              - name: DOCKER_TLS_VERIFY
                value: "1"
            volumeMounts:
              - name: runner-data
                mountPath: /data
              - name: runner-config
                mountPath: /config
                readOnly: true
              - name: runner-secret
                mountPath: /secret
                readOnly: true
              - name: docker-certs
                mountPath: /certs
          - name: dind
            image: docker:29.8.0-dind@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 1Gi
            command:
              - sh
              - -c
              - /scripts/dind-entrypoint.sh
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
            volumeMounts:
              - name: docker-storage
                mountPath: /var/lib/docker
              - name: docker-certs
                mountPath: /certs
              - name: dind-entrypoint
                mountPath: /scripts/dind-entrypoint.sh
                subPath: dind-entrypoint.sh
                readOnly: true
        volumes:
          - name: runner-data
            persistentVolumeClaim:
              claimName: forgejo-runner-cache
          - name: runner-config
            configMap:
              name: forgejo-runner-config
          - name: runner-secret
            secret:
              secretName: forgejo-runner-secret
          - name: docker-storage
            persistentVolumeClaim:
              claimName: forgejo-dind-storage
          - name: docker-certs
            emptyDir: {}
          - name: dind-entrypoint
            configMap:
              name: dind-entrypoint
              defaultMode: 0755

  pollingInterval: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  minReplicaCount: 0
  maxReplicaCount: 1
  triggers:
    - type: forgejo-runner
      metadata:
        name: "k8s-runner-1"
        address: "http://forgejo-http.forgejo.svc.cluster.local"
        global: "true"
        labels: "docker"
      authenticationRef:
        name: forgejo-runner-keda-creds
