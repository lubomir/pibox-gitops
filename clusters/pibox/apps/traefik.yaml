---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-traefik
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://github.com/lubomir/pibox-gitops.git
      targetRevision: main
      path: clusters/pibox/apps/traefik

    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 41.4.0
      helm:
        values: |
          experimental:
            plugins:
              fail2ban:
                moduleName: github.com/tomMoulard/fail2ban
                version: v0.9.0
          providers:
            kubernetesIngress:
              allowExternalNameServices: true
              publishedService:
                enabled: true
          ports:
            web:
              proxyProtocol:
                trustedIPs:
                  - 127.0.0.1/8
                  - 172.30.0.0/24
              forwardedHeaders:
                trustedIPs:
                  - 127.0.0.1/8
                  - 172.30.0.0/24
              http:
                redirections:
                  entryPoint:
                    to: websecure
                    scheme: https
            websecure:
              proxyProtocol:
                trustedIPs:
                  - 127.0.0.1/8
                  - 172.30.0.0/24
              forwardedHeaders:
                trustedIPs:
                  - 127.0.0.1/8
                  - 172.30.0.0/24
              http:
                middlewares:
                  - traefik-global-fail2ban@kubernetescrd

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
