---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/component: notifications-controller
    app.kubernetes.io/name: argocd-notifications-controller
    app.kubernetes.io/part-of: argocd
data:
  service.email: |
    host: smtp.gmail.com
    port: 587
    from: ArgoCD <lubomir.sedlar+argocd@gmail.com>
    username: $email-username
    password: $email-password
  template.app-sync-failed: |
    email:
      subject: Failed to sync application {{.app.metadata.name}}
    message: |
      Application: {{.app.metadata.name}} ({{.app.spec.project}})
      Sync: {{.app.status.sync.status}} ({{.app.status.sync.revision}})
      Source: {{.app.spec.source.repoURL}} / {{.app.spec.source.path}}
      Destination: {{.app.spec.destination.namespace}}
      Operation: {{.app.status.operationState.phase}} - {{.app.status.operationState.message}}
      Started: {{.app.status.operationState.startedAt}}
      Finished: {{.app.status.operationState.finishedAt}}
      {{- if .context.argocdUrl }}
      Details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}
      {{- end }}
  template.app-health-degraded: |
    email:
      subject: Application {{.app.metadata.name}} has degraded
    message: |
      Application: {{.app.metadata.name}} ({{.app.spec.project}})
      Health: {{.app.status.health.status}} since {{.app.status.health.lastTransitionTime}}
      Sync: {{.app.status.sync.status}} ({{.app.status.sync.revision}})
      Source: {{.app.spec.source.repoURL}} / {{.app.spec.source.path}}
      Destination: {{.app.spec.destination.namespace}}
      {{- if .app.status.operationState }}
      Last operation: {{.app.status.operationState.phase}} - {{.app.status.operationState.message}} ({{.app.status.operationState.finishedAt}})
      {{- end }}
      {{- if .context.argocdUrl }}
      Details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}
      {{- end }}
  trigger.on-sync-failed: |
    - description: Application syncing has failed
      send: [app-sync-failed]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
    - description: Application sync was terminated
      send: [app-sync-failed]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Terminating']
  trigger.on-health-degraded: |
    - description: Application has degraded
      send: [app-health-degraded]
      when: app.status.health.status == 'Degraded'
  subscriptions: |
    - recipients:
        - email:lubomir.sedlar@gmail.com
      triggers:
        - on-sync-failed
        - on-health-degraded
