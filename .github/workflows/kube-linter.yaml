name: Run kube-linter

on:
  push:
    paths:
      - '**.yaml'
  pull_request:
    paths:
      - '**.yaml'

jobs:
  kube-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: clusters
